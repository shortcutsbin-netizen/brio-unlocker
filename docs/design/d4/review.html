function debrief(){const win=S.result==='victory',seconds=win?240:116,kills=win?5:3,damage=win?1240:680,builds=win?18:12,weapon=win?[['SCAR',122],['Heavy sniper',55],['Pickaxe',63]]:[['SCAR',62],['Shotgun',29],['Pickaxe',25]],names=win?['ROOK','EMBER','PIPER','VALE','NOVA']:['ROOK','EMBER','PIPER'];return `<div class="bu-native-scope"><span class="bu-eyebrow">Review context · inserted into the native end-page panel only</span><section class="bu-report" aria-label="BRIO match statistics panel"><header class="bu-report-head"><div><span class="bu-eyebrow">BRIO UNLOCKED</span><h2>Match report</h2></div><span class="bu-report-place">#${win?'1':'6'} <small>PLACEMENT</small></span></header><div class="bu-report-totals">${[['Eliminations',kills],['Damage',damage.toLocaleString()],['Builds',builds],['Time alive',win?'4:00':'1:56']].map(([l,v])=>`<div><strong>${v}</strong><span>${l}</span></div>`).join('')}</div><div class="bu-report-body"><section><h3>Weapon time</h3><div class="bu-stacked" role="img" aria-label="Sampled weapon holding time">${weapon.map(([n,v],i)=>`<span style="width:${v/seconds*100}%;background:${['#b8e1c0','#ff8d4c','#87988d'][i]}"></span>`).join('')}</div>${weapon.map(([n,v],i)=>`<div class="bu-report-line"><span><i style="background:${['#b8e1c0','#ff8d4c','#87988d'][i]}"></i>${n}</span><strong>${v}s <small>${Math.round(v/seconds*100)}%</small></strong></div>`).join('')}<small class="bu-sampling">Sampled holding time</small><h3 class="bu-later">Eliminated <span>${kills}</span></h3><div class="bu-victims">${names.map((n,i)=>`<div><span>${String(i+1).padStart(2,'0')}</span>${n}</div>`).join('')}</div></section><section><h3>Observed loss</h3><div class="bu-loss"><div class="bu-loss-ring" role="img" aria-label="Observed health loss 120 and shield loss 175"><strong>295<small>TOTAL</small></strong></div><div><div class="bu-report-line">HP <strong>120</strong></div><div class="bu-report-line">Shield <strong>175</strong></div></div></div><div class="bu-report-line"><span>Travelled</span><strong>812 m</strong></div><div class="bu-report-line"><span>Your projectiles observed</span><strong>86</strong></div><div class="bu-report-line"><span>Players observed</span><strong>24</strong></div><details class="bu-derived"><summary>Match rates</summary><div class="bu-report-line">Damage / minute<strong>${Math.round(damage*60/seconds)}</strong></div><div class="bu-report-line">Builds / minute<strong>${(builds*60/seconds).toFixed(1)}</strong></div><div class="bu-report-line">Damage / elimination<strong>${Math.round(damage/kills)}</strong></div></details></section></div></section><p class="bu-context-note">Native result heading, navigation and play controls remain outside this panel. Figures here are sample data; no accuracy or per-player damage attribution is inferred.</p></div>`;}

function drawReticles(){root.querySelectorAll('canvas[data-shape]').forEach(canvas=>{const c=canvas.getContext('2d'),i=+canvas.dataset.shape,z=S.reticleSize/24;c.clearRect(0,0,160,160);c.save();c.translate(80,80);c.scale(2*z,2*z);c.strokeStyle=S.reticleColor;c.fillStyle=S.reticleColor;c.lineWidth=1.8;c.lineCap='round';c.lineJoin='round';c.shadowColor='#111';c.shadowBlur=0;c.shadowOffsetY=.6;const dot=()=>{c.beginPath();c.arc(0,0,1.3,0,Math.PI*2);c.fill();};if(i===0)dot();if(i===1){c.beginPath();for(const [x,y,x2,y2]of [[0,-12,0,-6],[0,6,0,12],[-12,0,-6,0],[6,0,12,0]]){c.moveTo(x,y);c.lineTo(x2,y2);}c.stroke();}if(i===2){c.beginPath();c.arc(0,0,9,0,Math.PI*2);c.stroke();dot();}if(i===3){c.beginPath();for(const [x,y]of [[-1,-1],[1,-1],[1,1],[-1,1]]){c.moveTo(x*11,y*5);c.lineTo(x*11,y*11);c.lineTo(x*5,y*11);}c.stroke();dot();}if(i===4){c.beginPath();for(let k=0;k<4;k++){c.save();c.rotate(k*Math.PI/2);c.moveTo(-3,-13);c.lineTo(0,-9);c.lineTo(3,-13);c.stroke();c.beginPath();c.restore();}dot();}if(i===5){c.beginPath();c.moveTo(-10,9);c.lineTo(0,2);c.lineTo(10,9);c.stroke();dot();}if(i===6){c.beginPath();c.moveTo(-11,0);c.lineTo(-5,0);c.moveTo(5,0);c.lineTo(11,0);c.moveTo(0,5);c.lineTo(0,13);c.stroke();}if(i===7){c.beginPath();c.moveTo(0,-6);c.lineTo(6,0);c.lineTo(0,6);c.lineTo(-6,0);c.closePath();c.stroke();}if(i===8){for(const [x,y]of [[0,-9],[9,0],[0,9],[-9,0]]){c.beginPath();c.arc(x,y,1.6,0,7);c.fill();}}if(i===9){for(const a of [0,Math.PI]){c.beginPath();c.arc(0,0,10,a+.5,a+2.64);c.stroke();}dot();}const lines=segments=>{c.beginPath();for(const [x,y,a,b]of segments){c.moveTo(x,y);c.lineTo(a,b);}c.stroke();},cross=(gap=0,len=12)=>lines([[-len,0,-gap,0],[gap,0,len,0],[0,-len,0,-gap],[0,gap,0,len]]),ring=r=>{c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke();},polygon=points=>{c.beginPath();points.forEach(([x,y],k)=>k?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.stroke();};
 if(i===10)cross();if(i===11){c.lineWidth=.9;cross(0,14);}if(i===12){cross(5);dot();}if(i===13){lines([[-12,0,-5,0],[5,0,12,0],[0,5,0,13]]);dot();}if(i===14){ring(7);cross(10,15);}if(i===15)polygon([[-7,-7],[7,-7],[7,7],[-7,7]]);if(i===16){polygon([[-8,-8],[8,-8],[8,8],[-8,8]]);dot();}if(i===17||i===18){polygon([[0,-9],[9,7],[-9,7]]);if(i===18)dot();}if(i===19){for(const [x,y]of [[0,0],[0,-9],[9,0],[0,9],[-9,0]]){c.beginPath();c.arc(x,y,1.3,0,7);c.fill();}}if(i===20)lines([[-14,0,-5,0],[5,0,14,0]]);if(i===21)lines([[-9,-8,-9,6],[-9,6,9,6],[9,6,9,-8]]);if(i===22)lines([[0,-15,0,-4],[0,4,0,15]]);if(i===23)lines([[-8,0,0,-6],[0,-6,8,0],[-8,8,0,2],[0,2,8,8]]);if(i===24){for(let a=0;a<3;a++){const angle=-Math.PI/2+a*Math.PI*2/3;lines([[Math.cos(angle)*5,Math.sin(angle)*5,Math.cos(angle)*13,Math.sin(angle)*13]]);}}if(i===25||i===26){lines([[-10,-10,-4,-4],[4,4,10,10],[10,-10,4,-4],[-4,4,-10,10]]);if(i===26)dot();}if(i===27){c.lineWidth=.9;ring(12);cross(0,17);dot();}if(i===28)lines([[-9,7,-9,-9],[-9,-9,7,-9]]);if(i===29){c.beginPath();c.arc(0,0,10,Math.PI*.7,Math.PI*2.3);c.stroke();dot();}if(i===30){dot();lines([[0,7,0,14]]);}if(i===31){polygon([[0,-5],[5,0],[0,5],[-5,0]]);cross(8,15);}if(i===32){for(let a=0;a<8;a++){const angle=a*Math.PI/4;lines([[Math.cos(angle)*7,Math.sin(angle)*7,Math.cos(angle)*12,Math.sin(angle)*12]]);}}if(i===33)c.fillRect(-1.5,-1.5,3,3);if(i===34){c.lineWidth=.9;cross(2,9);c.lineWidth=3.3;cross(10,16);}if(i===35){polygon([[-5,-5],[5,-5],[5,5],[-5,5]]);cross(9,15);}
 c.restore();});}
function cosmetics(){return `<div class="bu-wide-title"><h1>BRIO Originals</h1><span class="bu-pill">16 sets · 64 concepts</span></div><div class="bu-kit-list">${kits.map((k,i)=>`<section class="bu-kit-strip"><header><span class="bu-eyebrow">SET ${String(i+1).padStart(2,'0')}</span><h3>${k.name}</h3><button class="bu-btn" data-kit="${i}">Preview loadout</button></header><div class="bu-kit-pieces">${['Head','Body','Pickaxe','Glider'].map((n,c)=>`<div>${sprite(i,c)}<span>${n}</span></div>`).join('')}</div></section>`).join('')}</div>`;}

function render(){root.innerHTML=`<div class="bu-review"><div class="bu-reviewline"><div class="bu-eyebrow">D4 / FIELD KIT</div><span class="bu-draft">DESIGN REVIEW · SAMPLE DATA</span></div><div class="bu-reviewnav" role="tablist" aria-label="Design review screens">${views.map(([id,n])=>`<button role="tab" aria-selected="${S.view===id}" data-open="${id}">${n}</button>`).join('')}</div>${S.view==='session'?`<div class="bu-reviewnav" style="margin-top:10px" aria-label="Session sample states">${[['ten','10 matches'],['empty','New session'],['partial','Partial data']].map(([k,l])=>`<button data-session-sample="${k}" aria-selected="${S.sessionSample===k}">${l}</button>`).join('')}</div>`:''}${S.view==='debrief'?`<div class="bu-reviewnav" style="margin-top:10px" aria-label="Example result state"><button data-result="victory" aria-selected="${S.result==='victory'}">Victory sample</button><button data-result="eliminated" aria-selected="${S.result==='eliminated'}">Elimination sample</button></div>`:''}</div><div class="bu-stage" role="tabpanel">${S.view==='session'?sessionView():S.view==='home'?home():S.view==='locker'?lockerView():['modifiers','challenges'].includes(S.view)?extrasView(S.view):S.view==='debrief'?debrief():S.view==='crosshairs'?reticlesView():S.view==='cosmetics'?cosmetics():S.view==='indicator'?indicator():logo()}${uploadModal()}</div><div class="bu-toast" aria-live="polite">Draft interactions only · live V68 is unchanged.</div>`;root.style.setProperty('--bu-cosmetics',`url("${A.cosmetics}")`);globalThis.lucide?.createIcons();drawReticles();drawPreview();}
function open(view){S.view=view;S.upload=null;render();}
root.addEventListener('click',e=>{const b=e.target.closest('button,[data-open]');if(!b)return;if(b.dataset.sessionSample){loadSessionSample(b.dataset.sessionSample);render();return;}if(b.dataset.open){open(b.dataset.open);return;}if(b.hasAttribute('data-preview-pause')){S.previewPaused=!S.previewPaused;render();return;}if(b.dataset.logo){S.logo=b.dataset.logo;render();return;}if(b.dataset.color){const [key,value]=b.dataset.color.split(':');setColor(key,value);render();return;}if(b.dataset.size){S.inventorySize=b.dataset.size;render();return;}if(b.dataset.follow){S.follow=b.dataset.follow;render();return;}if(b.dataset.result){S.result=b.dataset.result;render();return;}if(b.dataset.category){S.category=b.dataset.category;S.filter='All';S.search='';render();}else if(b.dataset.part){S.part=b.dataset.part;S.search='';render();}else if(b.dataset.slot!==undefined){S.emoteSlot=+b.dataset.slot;render();}else if(b.dataset.filter){S.filter=b.dataset.filter;render();}else if(b.dataset.equip){const c=currentCat();S.lastEdited=c;S.selection[c+(c==='emote'?S.emoteSlot:'')]=b.dataset.equip;render();}else if(b.dataset.group){const [k,g]=b.dataset.group.split(':');S.group[k]=g;render();}else if(b.hasAttribute('data-advantages')){for(const row of D.rows)if(row.category==='modifiers'&&row.id!=='inventorySize')S.enabled[row.id]=advantageIds.includes(row.id);S.inventorySize='large';S.thresholds=structuredClone(defaults);S.hell=false;render();notify('General Advantages selected; other modifiers cleared. Every setting remains editable.');}else if(b.dataset.resetWarning){S.thresholds[b.dataset.resetWarning]=[...defaults[b.dataset.resetWarning]];render();}else if(b.dataset.tier){const [id,v]=b.dataset.tier.split(':');S.tier[id]=v;render();}else if(b.dataset.reticle!==undefined){S.reticle=+b.dataset.reticle;render();}else if(b.dataset.kit!==undefined){S.kit=+b.dataset.kit;S.category='skin';S.part='body';S.filter='Originals';for(const c of ['head','body','pickaxe','glider'])S.selection[c]=kits[S.kit].name;S.lastEdited='pickaxe';open('locker');}else if(b.hasAttribute('data-upload')){S.upload=currentCat();render();}else if(b.hasAttribute('data-cancel-upload')){S.upload=null;render();}else if(b.hasAttribute('data-discord'))notify('Discord design is ready; the invite URL still needs to be supplied.');else if(b.hasAttribute('data-home-play'))notify('Design preview only. This does not start a real match.');});
root.addEventListener('change',e=>{const n=e.target;if(n.dataset.feature){S.enabled[n.dataset.feature]=n.checked;render();}else if(n.hasAttribute('data-hell')){S.hell=n.checked;render();}else if(n.hasAttribute('data-inventory-size'))S.inventorySize=n.value;else if(n.hasAttribute('data-name')){S.showName=n.checked;render();}else if(n.hasAttribute('data-upload-file')){const file=n.files?.[0];if(!file)return;if(!['image/png','image/webp'].includes(file.type)||file.size>1024*1024){notify('Choose a PNG or WebP smaller than 1 MiB for this design preview.');return;}const part=S.upload,reader=new FileReader;reader.onload=()=>{if(!part)return;S.uploads[part]??=[];S.uploads[part].push({name:file.name,data:reader.result,type:'upload'});S.upload=null;S.filter='Uploads';render();notify('Local image added to this preview only.');};reader.readAsDataURL(file);}});
