const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const sprite=(row,col,cl='')=>{const extra=row>=5,newer=row>2,glider=col===3,src=extra?A.sets[row-5]:newer?A.newsets:glider?A.gliders:A.cosmetics,size=extra?'200% 200%':newer?'400% 200%':glider?'300% 100%':'300% 300%',x=extra?(col%2)*100:newer?col*100/3:glider?row*50:col*50,y=extra?Math.floor(col/2)*100:newer?(row-3)*100:glider?50:row*50;return `<div class="bu-sprite ${cl}" data-kit="${row}" data-piece="${col}" role="img" aria-label="${kits[row].name} ${['head','body','pickaxe','glider'][col]}" style="background-image:url('${src}');background-size:${size};background-position:${x}% ${y}%"></div>`;};
const notify=t=>{root.querySelector('.bu-toast').textContent=t;};
function header(active){return `<div class="bu-topbar"><div class="bu-brand"><div class="bu-monogram">BU</div><div class="bu-wordmark">BRIO UNLOCKED</div></div><div class="bu-header-nav"><span>${active==='locker'?'Unlocker':'Extras'}</span><button class="bu-close" data-open="home" aria-label="Close menu">${icon('x')}</button></div></div>`;}
function shell(active,side,content,foot=''){return `<div class="bu-surface">${header(active)}<div class="bu-main"><aside class="bu-sidebar">${side}</aside><div class="bu-workspace">${content}</div></div>${foot}</div>`;}
function title(k,h,p,tag=''){const label=k.startsWith('Unlocker')?catInfo[S.category][0]:k.startsWith('Extras')?(S.view==='modifiers'?'Modifiers':'Challenges'):h;return `<div class="bu-titleline"><h2>${label}</h2>${tag?`<span class="bu-pill">${tag}</span>`:''}</div>`;}
function currentCat(){return S.category==='skin'?S.part:S.category;}
function lockerView(){
 const c=currentCat(),selected=S.selection[c+(c==='emote'?S.emoteSlot:'')]||'Native',custom=['body','head','pickaxe','glider'].includes(c);

 const modes=['Native','Random',...['body','head','pickaxe','trail','glider'].includes(c)?['Invisible']:[]];
 const items=[...(custom?kits.map((k,i)=>({name:k.name,row:i,col:['head','body','pickaxe','glider'].indexOf(c),type:'original'})):[]),...(A.native[c==='wrap'?'combos':c==='trail'?'trails':c==='emote'?'emotes':c]||[]).map(a=>({name:a.name,data:a.data,type:'native'})),...(S.uploads[c]||[])];
 const cards=items.filter(x=>(S.filter==='All'||(S.filter==='Originals'?x.type==='original':x.type==='upload'))&&x.name.toLowerCase().includes(S.search.toLowerCase())).map(x=>`<button class="bu-item ${selected===x.name?'selected':''}" data-equip="${escape(x.name)}" aria-pressed="${selected===x.name}"><span class="bu-art">${x.special?`<span class="bu-special">${x.special}</span>`:x.row!==undefined?sprite(x.row,x.col):`<img src="${x.data}" alt="${escape(x.name)}">`}</span><span class="bu-itemname">${escape(x.name)}</span></button>`).join('');
 const content=playerPreview()+title('Unlocker / '+catInfo[S.category][0],S.category==='skin'?'Built to stand out.':catInfo[S.category][0]+', unlocked.','Choose a look. Keep your own edge.',selected==='Native'?'Game default':'Custom loadout')+
 (S.category==='skin'?`<div class="bu-segment" style="margin-bottom:13px"><button data-part="body" class="${S.part==='body'?'active':''}">Body</button><button data-part="head" class="${S.part==='head'?'active':''}">Head</button></div>`:'')+
 (S.category==='emote'?`<div class="bu-slotbar">${[0,1,2,3].map(i=>`<button class="${S.emoteSlot===i?'active':''}" data-slot="${i}">Slot ${i+1}</button>`).join('')}</div>`:'')+
 `<div class="bu-segment">${['All',...(custom?['Originals','Uploads']:[])].map(f=>`<button data-filter="${f}" class="${S.filter===f?'active':''}">${f}</button>`).join('')}</div><div class="bu-toolbar"><label class="bu-search">${icon('search')}<input data-search placeholder="Search ${c==='emote'?'emotes':c==='body'?'bodies':c+'s'}" aria-label="Search cosmetics" value="${escape(S.search)}"></label>${custom&&c!=='glider'?`<button class="bu-btn" data-upload>${icon('upload')}Import</button>`:''}</div><div class="bu-modebar"><span class="bu-eyebrow" style="font-size:10px">Mode</span>${modes.map((m,i)=>`<button data-equip="${m}" class="bu-mode ${selected===m?'active':''}" aria-pressed="${selected===m}">${icon(['rotate-ccw','shuffle','eye-off'][i])}${m==='Native'?'Game default':m}</button>`).join('')}</div><div class="bu-grid">${cards||'<div class="bu-empty">No matches. Try another search or import your own.</div>'}</div>`;
 return shell('locker',side,content,`<div class="bu-equipped"><span><span class="bu-contrast-dot"></span>${escape(c==='emote'?'Emote slot '+(S.emoteSlot+1):c[0].toUpperCase()+c.slice(1))} selected · <strong>${escape(selected==='Native'?'Game default':selected)}</strong></span><span style="color:var(--bu-muted)">Preview catalogue</span></div>`);
}

function cosmetics(){return `<div class="bu-wide-title"><h1>BRIO Originals</h1><span class="bu-pill">10 sets · 40 concepts</span></div><div class="bu-kit-list">${kits.map((k,i)=>`<section class="bu-kit-strip"><header><span class="bu-eyebrow">SET ${String(i+1).padStart(2,'0')}</span><h3>${k.name}</h3><button class="bu-btn" data-kit="${i}">Preview loadout</button></header><div class="bu-kit-pieces">${['Head','Body','Pickaxe','Glider'].map((n,c)=>`<div>${sprite(i,c)}<span>${n}</span></div>`).join('')}</div></section>`).join('')}</div>`;}
function indicator(){return `<div class="bu-wide-title"><h1>Target indicator</h1></div><div class="bu-indicator-board"><div class="bu-indicator" style="--bu-indicator-color:${S.indicatorColor};--bu-bearing:-35deg"><div class="bu-arrow" role="img" aria-label="Arrow toward target"></div><div class="bu-distance">157<small>m</small></div>${S.showName?'<div class="bu-targetname">PLAYER ONE</div>':''}</div><p class="bu-arrow-note">Direction follows the target.<br>Distance and name stay upright.</p></div><div class="bu-controls">${colors('indicator',S.indicatorColor)}<label><input type="checkbox" data-name ${S.showName?'checked':''}>Player name</label></div>`;}
function logo(){return `<div class="bu-wide-title"><h1>Wordmark</h1></div><div class="bu-logo-board"><div class="bu-logo-main"><img src="${A.logo}" alt="BRIO UNLOCKED gradient lettering"></div><div class="bu-logo-variants"><div><img src="${A.logo}" alt="New logo at compact size"><p>Compact size</p></div><div><img src="${A.nativeLogo}" alt="Original Build Royale logo"><p>Native reference</p></div></div></div>`;}
function uploadModal(){if(!S.upload)return '';return `<div class="bu-modal-shade"><section class="bu-upload" aria-label="Import custom cosmetic"><div class="bu-row-actions"><span class="bu-eyebrow">CUSTOM / ${escape(S.upload)}</span><button class="bu-close" data-cancel-upload aria-label="Close import">${icon('x')}</button></div><h2>Import image</h2><p class="bu-note">Choose a local image for your ${escape(S.upload)}.</p><div class="bu-upload-zone">${icon('upload')}<div style="margin-top:10px">Choose image</div><input type="file" accept="image/png,image/webp" data-upload-file aria-label="Choose image"></div><small style="color:var(--bu-muted)">PNG or WebP · Transparent backgrounds work best.</small></section></div>`;}
function render(){root.innerHTML=`<div class="bu-review"><div class="bu-reviewline"><div class="bu-eyebrow">D3 / FIELD KIT</div><span class="bu-draft">DESIGN REVIEW · SAMPLE DATA</span></div><div class="bu-reviewnav" role="tablist" aria-label="Design review screens">${views.map(([id,n])=>`<button role="tab" aria-selected="${S.view===id}" data-open="${id}">${n}</button>`).join('')}</div>${S.view==='debrief'?`<div class="bu-reviewnav" style="margin-top:10px" aria-label="Example result state"><button data-result="victory" aria-selected="${S.result==='victory'}">Victory sample</button><button data-result="eliminated" aria-selected="${S.result==='eliminated'}">Elimination sample</button></div>`:''}</div><div class="bu-stage" role="tabpanel">${S.view==='home'?home():S.view==='locker'?lockerView():['modifiers','challenges'].includes(S.view)?extrasView(S.view):S.view==='debrief'?debrief():S.view==='crosshairs'?reticlesView():S.view==='cosmetics'?cosmetics():S.view==='indicator'?indicator():logo()}${uploadModal()}</div><div class="bu-toast" aria-live="polite">Draft interactions only · live V68 is unchanged.</div>`;root.style.setProperty('--bu-cosmetics',`url("${A.cosmetics}")`);globalThis.lucide?.createIcons();drawReticles();drawPreview();}
function open(view){S.view=view;S.upload=null;render();}
root.addEventListener('click',e=>{const b=e.target.closest('button,[data-open]');if(!b)return;if(b.dataset.open){open(b.dataset.open);return;}if(b.hasAttribute('data-preview-pause')){S.previewPaused=!S.previewPaused;render();return;}if(b.dataset.logo){S.logo=b.dataset.logo;render();return;}if(b.dataset.color){const [key,value]=b.dataset.color.split(':');setColor(key,value);render();return;}if(b.dataset.size){S.inventorySize=b.dataset.size;render();return;}if(b.dataset.follow){S.follow=b.dataset.follow;render();return;}if(b.dataset.result){S.result=b.dataset.result;render();return;}if(b.dataset.category){S.category=b.dataset.category;S.filter='All';S.search='';render();}else if(b.dataset.part){S.part=b.dataset.part;S.search='';render();}else if(b.dataset.slot!==undefined){S.emoteSlot=+b.dataset.slot;render();}else if(b.dataset.filter){S.filter=b.dataset.filter;render();}else if(b.dataset.equip){const c=currentCat();S.lastEdited=c;S.selection[c+(c==='emote'?S.emoteSlot:'')]=b.dataset.equip;render();}else if(b.dataset.group){const [k,g]=b.dataset.group.split(':');S.group[k]=g;render();}else if(b.hasAttribute('data-advantages')){for(const row of D.rows)if(row.category==='modifiers'&&row.id!=='inventorySize')S.enabled[row.id]=advantageIds.includes(row.id);S.inventorySize='large';S.thresholds=structuredClone(defaults);S.hell=false;render();notify('General Advantages selected; other modifiers cleared. Every setting remains editable.');}else if(b.dataset.resetWarning){S.thresholds[b.dataset.resetWarning]=[...defaults[b.dataset.resetWarning]];render();}else if(b.dataset.tier){const [id,v]=b.dataset.tier.split(':');S.tier[id]=v;render();}else if(b.dataset.reticle!==undefined){S.reticle=+b.dataset.reticle;render();}else if(b.dataset.kit!==undefined){S.kit=+b.dataset.kit;S.category='skin';S.part='body';S.filter='Originals';for(const c of ['head','body','pickaxe','glider'])S.selection[c]=kits[S.kit].name;S.lastEdited='pickaxe';open('locker');}else if(b.hasAttribute('data-upload')){S.upload=currentCat();render();}else if(b.hasAttribute('data-cancel-upload')){S.upload=null;render();}else if(b.hasAttribute('data-discord'))notify('Discord design is ready; the invite URL still needs to be supplied.');else if(b.hasAttribute('data-home-play'))notify('Design preview only. This does not start a real match.');});
root.addEventListener('change',e=>{const n=e.target;if(n.dataset.feature){S.enabled[n.dataset.feature]=n.checked;render();}else if(n.hasAttribute('data-hell')){S.hell=n.checked;render();}else if(n.hasAttribute('data-inventory-size'))S.inventorySize=n.value;else if(n.hasAttribute('data-name')){S.showName=n.checked;render();}else if(n.hasAttribute('data-upload-file')){const file=n.files?.[0];if(!file)return;if(!['image/png','image/webp'].includes(file.type)||file.size>1024*1024){notify('Choose a PNG or WebP smaller than 1 MiB for this design preview.');return;}const part=S.upload,reader=new FileReader;reader.onload=()=>{if(!part)return;S.uploads[part]??=[];S.uploads[part].push({name:file.name,data:reader.result,type:'upload'});S.upload=null;S.filter='Uploads';render();notify('Local image added to this preview only.');};reader.readAsDataURL(file);}});
function setColor(key,value){if(key==='reticle')S.reticleColor=value;else if(key==='indicator')S.indicatorColor=value;else S.colors[key]=value;}
root.addEventListener('input',e=>{const n=e.target;if(n.dataset.hex){const valid=/^#[0-9a-f]{6}$/i.test(n.value);n.setAttribute('aria-invalid',String(!valid));n.setCustomValidity(valid?'':'Use # followed by six hexadecimal digits.');if(valid){setColor(n.dataset.hex,n.value);drawReticles();root.querySelector('.bu-indicator')?.style.setProperty('--bu-indicator-color',S.indicatorColor);}return;}if(n.hasAttribute('data-search')){S.search=n.value;const start=n.selectionStart;render();const f=root.querySelector('[data-search]');f.focus();f.setSelectionRange(start,start);}else if(n.dataset.threshold){const [k,i]=n.dataset.threshold.split(':');S.thresholds[k][+i]=Math.max(0,Math.min(9999,+n.value||0));}else if(n.hasAttribute('data-reticle-color')){S.reticleColor=n.value;drawReticles();}else if(n.hasAttribute('data-reticle-size')){S.reticleSize=+n.value;root.querySelector('[data-reticle-size-value]').textContent=S.reticleSize+'px';drawReticles();}else if(n.hasAttribute('data-indicator-color')){S.indicatorColor=n.value;root.querySelector('.bu-indicator').style.setProperty('--bu-indicator-color',n.value);}else if(n.hasAttribute('data-bearing')){S.bearing=+n.value;root.querySelector('.bu-indicator').style.setProperty('--bu-bearing',n.value+'deg');n.nextElementSibling.textContent=n.value+'°';}});
document.addEventListener('visibilitychange',()=>{if(S.view==='locker')drawPreview();});
window.BRIO_D3={pose:c=>({body:Math.PI/2+c/16,head:Math.PI/2+c/32,hands:-c/8,footA:2-15*c,footB:2+15*c}),open,state:S,render,views:views.map(x=>x[0]),groups,reticles,advantageIds};render();
})();

</script>
</main></body></html>
