 const c=currentCat(),selected=S.selection[c+(c==='emote'?S.emoteSlot:'')]||'Native',custom=['body','head','pickaxe'].includes(c);

root.addEventListener('click',e=>{const b=e.target.closest('button,[data-open]');if(!b)return;if(b.dataset.open){open(b.dataset.open);return;}if(b.dataset.result){S.result=b.dataset.result;render();return;}if(b.dataset.category){S.category=b.dataset.category;S.filter='All';S.search='';render();}else if(b.dataset.part){S.part=b.dataset.part;S.search='';render();}else if(b.dataset.slot!==undefined){S.emoteSlot=+b.dataset.slot;render();}else if(b.dataset.filter){S.filter=b.dataset.filter;render();}else if(b.dataset.equip){const c=currentCat();S.selection[c+(c==='emote'?S.emoteSlot:'')]=b.dataset.equip;render();}else if(b.dataset.group){const [k,g]=b.dataset.group.split(':');S.group[k]=g;render();}else if(b.hasAttribute('data-advantages')){advantageIds.forEach(id=>S.enabled[id]=true);S.inventorySize='large';S.thresholds=structuredClone(defaults);S.hell=false;render();notify('General Advantages selected. Every setting remains editable.');}else if(b.dataset.resetWarning){S.thresholds[b.dataset.resetWarning]=[...defaults[b.dataset.resetWarning]];render();}else if(b.dataset.tier){const [id,v]=b.dataset.tier.split(':');S.tier[id]=v;render();}else if(b.dataset.reticle!==undefined){S.reticle=+b.dataset.reticle;render();}else if(b.dataset.kit!==undefined){S.kit=+b.dataset.kit;S.category='skin';S.part='body';S.filter='Originals';S.selection.body=kits[S.kit].name;open('locker');}else if(b.hasAttribute('data-upload')){S.upload=currentCat();render();}else if(b.hasAttribute('data-cancel-upload')){S.upload=null;render();}else if(b.hasAttribute('data-discord'))notify('Discord design is ready; the invite URL still needs to be supplied.');else if(b.hasAttribute('data-home-play'))notify('Design preview only. This does not start a real match.');});
root.addEventListener('change',e=>{const n=e.target;if(n.dataset.feature){S.enabled[n.dataset.feature]=n.checked;render();}else if(n.hasAttribute('data-hell')){S.hell=n.checked;render();}else if(n.hasAttribute('data-inventory-size'))S.inventorySize=n.value;else if(n.hasAttribute('data-name')){S.showName=n.checked;render();}else if(n.hasAttribute('data-upload-file')){const file=n.files?.[0];if(!file)return;if(!['image/png','image/webp'].includes(file.type)||file.size>1024*1024){notify('Choose a PNG or WebP smaller than 1 MiB for this design preview.');return;}const part=S.upload,reader=new FileReader;reader.onload=()=>{if(!part)return;S.uploads[part]??=[];S.uploads[part].push({name:file.name,data:reader.result,type:'upload'});S.upload=null;S.filter='Uploads';render();notify('Local image added to this preview only.');};reader.readAsDataURL(file);}});
root.addEventListener('input',e=>{const n=e.target;if(n.hasAttribute('data-search')){S.search=n.value;const start=n.selectionStart;render();const f=root.querySelector('[data-search]');f.focus();f.setSelectionRange(start,start);}else if(n.dataset.threshold){const [k,i]=n.dataset.threshold.split(':');S.thresholds[k][+i]=Math.max(0,Math.min(9999,+n.value||0));}else if(n.hasAttribute('data-reticle-color')){S.reticleColor=n.value;drawReticles();}else if(n.hasAttribute('data-reticle-size')){S.reticleSize=+n.value;root.querySelector('[data-reticle-size-value]').textContent=S.reticleSize+'px';drawReticles();}else if(n.hasAttribute('data-indicator-color')){S.indicatorColor=n.value;root.querySelector('.bu-indicator').style.setProperty('--bu-indicator-color',n.value);}else if(n.hasAttribute('data-bearing')){S.bearing=+n.value;root.querySelector('.bu-indicator').style.setProperty('--bu-bearing',n.value+'deg');n.nextElementSibling.textContent=n.value+'°';}});
window.BRIO_D1={open,state:S,render,views:views.map(x=>x[0]),groups,reticles,advantageIds};render();
})();

</script>
</main></body></html>
